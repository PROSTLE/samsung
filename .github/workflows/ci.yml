name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m data.labels.build
      - run: python -m eval.grid_self_repair
      - run: python -m eval.showcase

  # The LiveKit agent, the Show & Fix extension, and FDB-v3's own template and
  # mock APIs, at the commit scripts/reproduce_fdb_v3.sh pins. No API keys:
  # a real AgentSession runs in text mode with a scripted LLM.
  livekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements/agent.lock.txt pytest hypothesis
      - run: python -m pip install --no-deps -e .
      - name: FDB-v3 at the pinned commit (code only; the audio is not needed)
        run: |
          commit=$(sed -n 's/^FDB_COMMIT="\([0-9a-f]\{40\}\)".*/\1/p' scripts/reproduce_fdb_v3.sh)
          git clone -q https://github.com/DanielLin94144/Full-Duplex-Bench.git third_party/Full-Duplex-Bench
          git -C third_party/Full-Duplex-Bench checkout -q "$commit"
      - run: python -m pytest tests/test_livekit_template.py tests/test_livekit_gate.py tests/test_livekit_session.py tests/test_show_and_fix.py
        env:
          KEEL_FDB_DIR: third_party/Full-Duplex-Bench/v3
      - run: bash -n scripts/reproduce_fdb_v3.sh
