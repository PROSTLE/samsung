[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
description = "Interruption-safe execution layer for real-time voice agents"
readme = "README.md"
# FDB-v3's README sets up Python 3.10; the kernel is tested on 3.10-3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "tomli>=2.0; python_version < '3.11'",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]
# The LiveKit agent (keel.livekit) and the Show & Fix extension. Exact pins for
# the benchmark run are in requirements/agent.lock.txt. keel/livekit/session.py
# imports the Google plugin at start-up (gemini_realtime), so it is required.
livekit = [
    "livekit-agents[openai,google,silero,turn-detector]==1.8.3",
    "python-dotenv==1.2.3",
]
# The web app alone (python -m keel.web): sessions, replays, results, setup.
# The live page also needs LiveKit keys; the agent runs from the livekit extra.
web = [
    "aiohttp>=3.9",
    "livekit-api>=1.0",
    "python-dotenv>=1.0",
]
# The local speech server of the open pipeline (python -m keel.speech).
# Exact pins: requirements/speech.lock.txt.
speech = [
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.6.1",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
include = ["keel*", "extension*"]

# Non-Python files the package reads at runtime. Without this a wheel install
# has no classifier model (and no console template) and fails on first use.
[tool.setuptools.package-data]
"keel.compiler" = ["model.json"]
"keel.console" = ["template.html"]
"keel.web" = ["static/*", "examples.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# data/fetch is a script package at the repo root, not part of the installed wheel.
pythonpath = ["."]
addopts = "-q"
