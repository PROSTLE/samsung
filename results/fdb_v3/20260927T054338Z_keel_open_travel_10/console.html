<style>
/* Keel trace console. Light theme only, by design: it is read on projectors
   and in screenshots, so one well-tuned palette beats two average ones. */
:root {
  color-scheme: light;
  --paper: #F6F8FA;
  --panel: #FFFFFF;
  --ink: #17212B;
  --ink-2: #46535F;
  --ink-3: #7A8691;
  --line: #DCE2E8;
  --line-2: #EDF1F4;
  --accent: #0F5E8C;
  --accent-soft: #E4EFF6;
  --read: #0E7C6B;
  --read-soft: #DFF1ED;
  --write: #5B45C9;
  --write-soft: #ECE8FA;
  --ok: #1F7A4D;
  --ok-soft: #E2F2E9;
  --bad: #B42318;
  --bad-soft: #FBE8E6;
  --doubt: #9A5A06;
  --doubt-soft: #FBEFD9;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 24px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: 24px; line-height: 1.25; letter-spacing: -0.01em; }
h2 { font-size: 15px; letter-spacing: 0.01em; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.mono, code { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.brand svg { display: block; }
.brand span { color: var(--ink-3); font-weight: 400; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  color: var(--ink-2); font-size: 13px;
}
.tab:hover { background: var(--line-2); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: #C6DDEB; font-weight: 500; }

/* ---------- scenario head ---------- */
.head { padding-block: 28px 18px; display: grid; gap: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-3); font-size: 12.5px; }
.meta b { color: var(--ink-2); font-weight: 500; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid; vertical-align: 3px;
}
.badge.synthetic { color: var(--doubt); background: var(--doubt-soft); border-color: #EDD3A6; }
.badge.real { color: var(--ok); background: var(--ok-soft); border-color: #BFE0CC; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- verdict strip ---------- */
.strip { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 900px) { .strip { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
.panel > header p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.pad { padding: 14px 16px 16px; }
.checks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .checks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.check { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; display: grid; gap: 2px; background: var(--panel); }
.check .id { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 500; }
.check .t { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.check.pass { border-color: #C7E3D2; background: linear-gradient(var(--ok-soft), var(--panel) 70%); }
.check.pass .id { color: var(--ok); }
.check.fail { border-color: #F1C1BB; background: var(--bad-soft); }
.check.fail .id { color: var(--bad); }
.check.unchecked .id { color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.stat .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .v small { font-size: 13px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--ink-3); }

/* ---------- sections ---------- */
section.block { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

/* ---------- timeline ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; vertical-align: 0; margin-right: 5px; }
.tl-scroll { overflow-x: auto; position: relative; }
.tl-scroll svg { display: block; }
.tl-scroll svg text { font-family: var(--sans); }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: #F4F7FA; font-size: 12px; line-height: 1.4;
  padding: 7px 9px; border-radius: 6px; max-width: 320px; box-shadow: 0 6px 20px rgba(23, 33, 43, 0.18); z-index: 3;
}
.tip b { font-weight: 600; }
.tip .mono { font-size: 11.5px; color: #C9D3DC; }
.hit { cursor: default; }

/* ---------- transcript ---------- */
.convo { display: grid; gap: 10px; padding: 14px 16px 18px; }
.turn { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.turn .ts { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); padding-top: 7px; text-align: right; font-variant-numeric: tabular-nums; }
.bubble { padding: 7px 11px; border-radius: 10px; max-width: 56ch; width: fit-content; }
.user .bubble { background: var(--line-2); border: 1px solid var(--line); }
.user .bubble.media { font-style: italic; color: var(--ink-2); }
.keel .bubble { background: var(--panel); border: 1px solid var(--line); }
.keel.final .bubble { border-color: #BFE0CC; background: var(--ok-soft); }
.keel.clarify .bubble { border-color: #EDD3A6; background: var(--doubt-soft); }
.who { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
.lat { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; }
.eot { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-weight: 400; }

/* ---------- final state ---------- */
.final-text { font-size: 16px; line-height: 1.45; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.tbl { overflow-x: auto; }
.versions { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.ver { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--line-2); color: var(--ink-2); }
.ver.cur { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.ver.struck { text-decoration: line-through; color: var(--ink-3); }
.arrow { color: var(--ink-3); font-size: 12px; }
.note { font-size: 12px; color: var(--ink-3); }

/* ---------- pills ---------- */
.pill { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill.read { color: var(--read); background: var(--read-soft); }
.pill.write { color: var(--write); background: var(--write-soft); }
.pill.unknown { color: var(--write); background: var(--panel); border-color: #CFC6F2; }
.pill.succeeded { color: var(--ok); background: var(--ok-soft); }
.pill.failed { color: var(--bad); background: var(--bad-soft); }
.pill.cancelled { color: var(--bad); background: var(--panel); border-color: #F1C1BB; }
.pill.doubt { color: var(--doubt); background: var(--doubt-soft); }
.pill.pending, .pill.in_flight { color: var(--ink-2); background: var(--line-2); }

/* ---------- calls ---------- */
details.call { border-bottom: 1px solid var(--line-2); }
details.call:last-child { border-bottom: 0; }
details.call > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(0, 2fr) auto; gap: 12px; padding: 11px 16px; align-items: center; }
details.call > summary::-webkit-details-marker { display: none; }
details.call > summary:hover { background: #FAFBFC; }
@media (max-width: 640px) { details.call > summary { grid-template-columns: 1fr; gap: 4px; } }
.call .name { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.call .sub { font-size: 12px; color: var(--ink-3); }
.call .args { font-family: var(--mono); font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.call .why { font-size: 12.5px; color: var(--bad); margin-top: 2px; }
.call .body { padding: 0 16px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .call .body { grid-template-columns: 1fr; } }
ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
ol.steps li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
ol.steps li span:first-child { font-family: var(--mono); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.evidence { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.sm-h { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }

/* ---------- log ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
input[type="search"] { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; flex: 1 1 200px; max-width: 320px; background: var(--panel); color: var(--ink); }
.count { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.log { max-height: 520px; overflow: auto; }
.log table td { font-size: 12.5px; padding: 6px 10px; }
.log tr.row { cursor: pointer; }
.log tr.row:hover td { background: #FAFBFC; }
.dir { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; }
.dir.in { color: var(--accent); background: var(--accent-soft); }
.dir.out { color: var(--ok); background: var(--ok-soft); }
.dir.note { color: var(--ink-2); background: var(--line-2); }
.dir.meta { color: var(--ink-3); background: var(--panel); border: 1px solid var(--line); }
.log .kind { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.log .sum { color: var(--ink-2); overflow-wrap: anywhere; }
pre.json { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { padding: 18px 16px; color: var(--ink-3); font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding-block: 28px 40px; }
@media (prefers-reduced-motion: no-preference) { .tab, .seg button { transition: background-color .12s ease; } }
</style>
</head>

    var h = v.header || {}, s = v.summary;
    var synthetic = h.synthetic !== false;
    var html = "";
    html += '<div class="head"><div class="eyebrow">Session ' + esc(h.session_id || "") + "</div>";
    html += '<div class="title-row"><h1>' + esc(v.name) + "</h1>" +
      (synthetic ? '<span class="badge synthetic" title="Tools, timings and interpretations were generated for this run">Synthetic</span>'

    html += '<div class="meta"><span>Contract <b>' + esc(h.schema_version || "?") + "</b></span><span>Config <b class=\"mono\">" +

        '<span class="sr" style="position:absolute;left:-9999px">' + esc(i.status) + '</span></div><div class="t">' + esc(i.title) + "</div></div>";
    });
    html += "</div></div>";
    html += '<div class="panel"><header><h2>This session</h2><p>From user turn end to Keel speaking</p></header><div class="pad stats">' +
      stat(s.first_response_max_ms == null ? "–" : s.first_response_max_ms, s.first_response_max_ms == null ? "" : "ms", "Slowest first response") +
      stat(s.first_response_median_ms == null ? "–" : s.first_response_median_ms, s.first_response_median_ms == null ? "" : "ms", "Median first response") +
      stat(s.finals, "", "Final responses") +
      stat(s.tool_calls, "", "Tool calls sent") + stat(s.cancels, "", "Cancellations") + stat(s.writes_sent, "", "Writes sent") +

      '<span><i style="background:' + C.read + '"></i>read-only call</span>' +
      '<span><i style="background:' + C.write + '"></i>state-changing call</span>' +
      '<span><i style="background:repeating-linear-gradient(135deg,' + C.write + ' 0 2px,#fff 2px 5px);border:1px solid ' + C.write + '"></i>held by the commit fence</span>' +
      '<span><i style="background:none;border-top:2px dashed ' + C.doubt + ';height:0;vertical-align:3px"></i>outcome in doubt</span>' +
      '</div></header><div class="pad"><div class="tl-scroll" id="tl"></div></div></section>';

    // conversation + final state
    html += '<div class="grid2"><div class="panel"><header><h2>Conversation</h2><p>What the user said and what Keel said back</p></header>' + convo(v) + "</div>";
    html += '<div class="panel"><header><h2>Final state</h2><p>The snapshot Keel reported</p></header><div class="pad">' + finalState(v) + "</div></div></div>";

    // calls
    html += '<section class="block panel"><header><h2>Tool calls</h2><p>Open a call for its full history and the evidence behind its safety class</p></header><div style="padding-top:8px">' +

        v.policies.map(function (p) {

            '</td><td class="num">' + (p.confidence == null ? "–" : Number(p.confidence).toFixed(2)) + '</td><td class="note">' + esc((p.evidence || []).join(" · ")) + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }

      '<div class="seg" role="group" aria-label="Filter records">' +
      ["all:All", "in:Inputs", "out:Actions", "note:Kernel notes"].map(function (x, i) {
        var p = x.split(":"); return '<button type="button" data-f="' + p[0] + '" aria-pressed="' + (i === 0) + '">' + p[1] + "</button>";
      }).join("") + '</div><input type="search" id="q" placeholder="Filter by kind, call id, slot…" aria-label="Filter the event log"><span class="count" id="count"></span></div>' +
      '<div class="log"><table><thead><tr><th style="width:84px">Time</th><th style="width:64px">Dir</th><th style="width:170px">Kind</th><th>Summary</th></tr></thead><tbody id="logbody"></tbody></table></div></section>';

  function stat(v, unit, k) {

  function finalState(v) {

  }

  function callRow(c, v) {

      '<div class="body"><div><p class="sm-h">History</p><ol class="steps">' + c.events.map(function (e) {

      '<p class="sm-h">Read</p><p class="note" style="margin:0 0 10px">' + (reads.length ? esc(reads.join(", ")) : "no session slots") + "</p>" +
      (pol ? '<p class="sm-h">Why ' + (c.safety === "read_only" ? "read-only" : "treated as a write") + '</p><ul class="evidence">' +
        (pol.evidence || []).map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul>" : "") + "</div></div></details>";

  // --------------------------------------------------------------- timeline
  function niceStep(span, target) {

    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }
  function drawTimeline(v) {
    var host = document.getElementById("tl");

    if (v.slots.length) lanes.push({ key: "slots", label: "Slots", sub: "new versions" });
    v.calls.forEach(function (c) { lanes.push({ key: "call", call: c, label: c.tool, sub: c.call_id.split(":").pop() + (c.probe_for ? " · status check" : "") }); });
    var width = Math.max(host.clientWidth || 800, 680), labelW = width < 760 ? 150 : 210, right = 18, top = 26, laneH = 34, bottom = 14;
    var t0 = 0, t1 = Math.max(v.duration_ms, 1);
    var starts = [].concat(v.inputs.map(function (i) { return i.ts; }), v.calls.map(function (c) { return c.created; }));
    if (starts.length) t0 = Math.max(0, Math.min.apply(null, starts) - Math.max(150, (t1 - Math.min.apply(null, starts)) * 0.04));
    var span = Math.max(1, t1 - t0), plotW = width - labelW - right;
    function x(t) { return labelW + ((t - t0) / span) * plotW; }
    var H = top + lanes.length * laneH + bottom, s = [];
    s.push('<svg width="' + width + '" height="' + H + '" viewBox="0 0 ' + width + " " + H + '" role="img" aria-label="Timeline of the session in virtual milliseconds">');
    s.push('<defs><pattern id="hatch-w" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="' + C.writeSoft + '"/><line x1="0" y1="0" x2="0" y2="5" stroke="' + C.write + '" stroke-width="1.4"/></pattern>' +
      '<pattern id="hatch-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="' + C.readSoft + '"/><line x1="0" y1="0" x2="0" y2="5" stroke="' + C.read + '" stroke-width="1.4"/></pattern></defs>');
    // grid + axis
    var step = niceStep(span, Math.max(4, Math.floor(plotW / 110)));
    for (var t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      s.push('<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (top - 6) + '" y2="' + (H - bottom) + '" stroke="' + C.line2 + '"/>');
      s.push('<text x="' + x(t) + '" y="' + (top - 11) + '" font-size="11" fill="' + C.ink3 + '" text-anchor="middle" style="font-variant-numeric:tabular-nums">' + (t >= 1000 ? (t / 1000).toFixed(step < 1000 ? 1 : 0) + " s" : t + " ms") + "</text>");
    }
    lanes.forEach(function (ln, k) {

      if (k % 2 === 1) s.push('<rect x="0" y="' + y + '" width="' + width + '" height="' + laneH + '" fill="#FAFBFC"/>');
      s.push('<text x="0" y="' + (mid - 2) + '" font-size="12" font-weight="500" fill="' + C.ink + '" style="font-family:var(--mono)">' + esc(trim(ln.label, labelW < 200 ? 17 : 24)) + "</text>");
      s.push('<text x="0" y="' + (mid + 11) + '" font-size="10.5" fill="' + C.ink3 + '">' + esc(ln.sub) + "</text>");
      s.push('<line x1="' + labelW + '" x2="' + (width - right) + '" y1="' + (y + laneH) + '" y2="' + (y + laneH) + '" stroke="' + C.line2 + '"/>');
      if (ln.key === "user") v.inputs.forEach(function (i) {
        var tip = "<b>User " + (i.kind === "text" ? "said" : "sent a " + esc(i.label)) + "</b> at " + i.ts + " ms" + (i.kind === "text" ? "<br>“" + esc(i.label) + "”" : "") + (i.end_of_turn && i.kind === "text" ? "<br><span class=mono>end of turn</span>" : "");
        s.push(hit(x(i.ts) - 7, y + 4, 14, laneH - 8, tip));
        if (i.kind === "text") s.push('<circle cx="' + x(i.ts) + '" cy="' + mid + '" r="5" fill="' + C.accent + '" pointer-events="none"/>' + (i.end_of_turn ? '<line x1="' + (x(i.ts) + 8) + '" x2="' + (x(i.ts) + 8) + '" y1="' + (mid - 7) + '" y2="' + (mid + 7) + '" stroke="' + C.accent + '" stroke-width="2" pointer-events="none"/>' : ""));
        else if (i.kind === "interrupt") s.push('<path d="M' + (x(i.ts) - 5) + " " + (mid + 5) + " L" + x(i.ts) + " " + (mid - 6) + " L" + (x(i.ts) + 5) + " " + (mid + 5) + ' Z" fill="' + C.doubt + '" pointer-events="none"/>');
        else s.push('<rect x="' + (x(i.ts) - 5) + '" y="' + (mid - 5) + '" width="10" height="10" rx="2" fill="' + C.panel + '" stroke="' + C.accent + '" stroke-width="1.6" pointer-events="none"/>');
      });
      if (ln.key === "keel") v.spoken.forEach(function (sp) {
        var col = sp.type === "final" ? C.ok : sp.type === "clarify" ? C.doubt : C.ink2;
        var tip = "<b>" + (sp.type === "final" ? "Final response" : sp.type === "clarify" ? "Clarifying question" : "Spoke (" + esc(sp.purpose) + ")") + "</b> at " + sp.ts + " ms<br>“" + esc(sp.text) + "”";
        s.push(hit(x(sp.ts) - 7, y + 4, 14, laneH - 8, tip));
        if (sp.type === "final") s.push('<path d="M' + x(sp.ts) + " " + (mid - 7) + " L" + (x(sp.ts) + 7) + " " + mid + " L" + x(sp.ts) + " " + (mid + 7) + " L" + (x(sp.ts) - 7) + " " + mid + ' Z" fill="' + col + '" pointer-events="none"/>');
        else s.push('<rect x="' + (x(sp.ts) - 4) + '" y="' + (mid - 6) + '" width="8" height="12" rx="4" fill="' + col + '" pointer-events="none"/>');

          var tip = group.map(function (g) {
            return "<b>" + esc(g.sl.name) + " → v" + g.ver.version + "</b> " + esc(val(g.ver.value)) + " · from " + esc(g.ver.source) + (g.ver.correction ? " · correction" : "");
          }).join("<br>") + "<br>at " + t + " ms";
          var label = group.map(function (g) { return g.sl.name + " v" + g.ver.version; }).join(", ");
          s.push(hit(xx - 6, y + 4, 12, laneH - 8, tip));
          s.push('<rect x="' + (xx - 4) + '" y="' + (mid - 4) + '" width="8" height="8" transform="rotate(45 ' + xx + " " + mid + ')" fill="' + (corr ? C.bad : C.ink2) + '" pointer-events="none"/>');
          s.push('<text x="' + (xx + 8) + '" y="' + (mid + 4) + '" font-size="11" fill="' + C.ink2 + '" pointer-events="none">' + esc(trim(label, 26)) + "</text>");
        });
      }
      if (ln.key === "call") s.push(callBar(ln.call, x, y, mid, laneH));
    });
    s.push("</svg>");
    host.innerHTML = s.join("") + '<div class="tip" id="tip" hidden></div>';
    var tipEl = document.getElementById("tip");
    host.onmousemove = function (e) {
      var h = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (!h) { tipEl.hidden = true; return; }
      tipEl.innerHTML = h.getAttribute("data-tip");
      tipEl.hidden = false;
      var r = host.getBoundingClientRect(), px = e.clientX - r.left + host.scrollLeft + 14, py = e.clientY - r.top + 14;
      if (px + 330 > host.scrollLeft + host.clientWidth) px = Math.max(0, px - 350);
      tipEl.style.left = px + "px"; tipEl.style.top = py + "px";
    };
    host.onmouseleave = function () { tipEl.hidden = true; };
  }
  function trim(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function hit(x0, y0, w, h, tip) {
    return '<rect class="hit" x="' + x0 + '" y="' + y0 + '" width="' + Math.max(w, 6) + '" height="' + h + '" fill="transparent" data-tip="' + esc(tip) + '"/>';
  }
  function callBar(c, x, y, mid, laneH) {
    var col = c.writes ? C.write : C.read, out = [], end = c.ended != null ? c.ended : (c.dispatched != null ? c.dispatched : c.created);
    var tip = "<b>" + esc(c.tool) + "</b> " + (c.writes ? "(changes state)" : "(read-only)") + "<br><span class=mono>" + esc(args(c.arguments)) + "</span><br>" +
      c.events.map(function (e) { return e.ts + " ms · " + esc(e.text); }).join("<br>");

      }

    }
    if (c.cancelled_at != null) {
      var cx = x(c.cancelled_at);
      out.push('<circle cx="' + cx + '" cy="' + mid + '" r="7" fill="' + C.panel + '" stroke="' + C.bad + '" stroke-width="1.6"/><path d="M' + (cx - 3) + " " + (mid - 3) + " L" + (cx + 3) + " " + (mid + 3) + " M" + (cx + 3) + " " + (mid - 3) + " L" + (cx - 3) + " " + (mid + 3) + '" stroke="' + C.bad + '" stroke-width="1.6" stroke-linecap="round"/>');

    var endCol = endMark === "✓" ? C.ok : endMark === "!" ? C.bad : C.doubt;
    if (endMark && c.ended != null) out.push('<text x="' + (x(end) + 6) + '" y="' + (mid + 4) + '" font-size="12" font-weight="600" fill="' + endCol + '">' + endMark + "</text>");
    if (c.reason) out.push('<text x="' + (x(c.cancelled_at) + 11) + '" y="' + (mid - 8) + '" font-size="10.5" fill="' + C.bad + '" style="font-family:var(--mono)">' + esc(trim(c.reason, 28)) + "</text>");
    var x0 = x(c.created) - 4, x1 = Math.max(x(end) + 18, x0 + 14);
    out.push(hit(x0, y + 3, x1 - x0, laneH - 6, tip));
    return out.join("");
  }

  // -------------------------------------------------------------------- log
  function summarize(r) {
    var d = r.data || {};
    if (r.dir === "in") {
      if (r.kind === "text") return "“" + (d.text || "") + "”" + (d.end_of_turn ? "  · end of turn" : "");
      if (r.kind === "tool_result") return d.call_id + " → " + d.status + (d.result != null ? "  " + JSON.stringify(d.result) : "") + (d.error ? "  " + d.error : "");
      if (r.kind === "manifest") return (d.tools || []).length + " tools: " + (d.tools || []).map(function (t) { return t.name; }).join(", ");
      return d.event_id || "";
    }
    if (r.dir === "out") {
      if (r.kind === "tool_call") return d.tool + "(" + args(d.arguments) + ")  " + d.call_id;
      if (r.kind === "cancel") return d.call_id + "  · " + d.reason;
      if (r.kind === "final") return "“" + d.text + "”  snapshot " + JSON.stringify(d.snapshot);
      return "“" + (d.text || "") + "”" + (d.purpose ? "  · " + d.purpose : "");
    }
    if (r.kind === "slot_changed") return d.slot + ": " + val(d.old_value) + " → " + val(d.value) + "  (v" + d.version + ", " + d.source + (d.correction ? ", correction" : "") + ")";
    if (r.kind === "call_created") return d.tool + "(" + args(d.arguments) + ")  " + d.call_id + " · " + d.safety;
    if (r.kind === "call_status") return d.call_id + " → " + d.status + (d.error ? " · " + d.error : "");
    if (r.kind === "call_cancelled") return d.call_id + " · " + d.reason + (d.outcome_in_doubt ? " · outcome in doubt" : "");
    if (r.kind === "interpretation") {
      var props = (d.proposals || []).map(function (q) { return q.name + "=" + val(q.value) + " (" + q.source + " " + q.confidence + (q.correction ? ", correction" : "") + ")"; });
      return (props.length ? props.join(", ") : "no slot proposals") + (d.goal ? "  · goal " + d.goal.intent + ", " + (d.goal.steps || []).length + " step(s)" : "") + (d.reply ? "  · reply" : "");
    }
    if (r.kind === "goal_set") return d.goal ? "goal " + d.goal.intent + ": " + (d.goal.steps || []).map(function (st) { return st.step_id + "→" + st.tool; }).join(", ") : "goal cleared";
    if (r.kind === "session_start") return (d.scenario ? d.scenario + " · " : "") + (d.synthetic ? "synthetic · " : "") + d.schema_version;
    if (r.kind === "fence_hold") return d.call_id + (d.until == null ? " held while the user is speaking" : " held until " + d.until + " ms");
    if (r.kind === "tool_policy") return d.tool + " → " + d.safety + " (" + d.method + ")";
    var s = JSON.stringify(d);
    return s.length > 180 ? s.slice(0, 179) + "…" : s;
  }
  function wireLog(v) {
    var body = document.getElementById("logbody"), q = document.getElementById("q"), count = document.getElementById("count");
    var filter = "all", open = {};
    var rows = v.log.map(function (r) { var s = summarize(r); return { r: r, s: s, hay: (r.kind + " " + s + " " + JSON.stringify(r.data)).toLowerCase() }; });
    function paint() {
      var needle = (q.value || "").trim().toLowerCase(), shown = 0, h = [];
      rows.forEach(function (x) {
        if (filter !== "all" && x.r.dir !== filter) return;
        if (needle && x.hay.indexOf(needle) < 0) return;
        shown++;
        h.push('<tr class="row" data-seq="' + x.r.seq + '" tabindex="0" aria-expanded="' + !!open[x.r.seq] + '"><td class="mono num">' + x.r.ts + '</td><td><span class="dir ' + x.r.dir + '">' + x.r.dir +
          '</span></td><td class="kind">' + esc(x.r.kind) + '</td><td class="sum">' + esc(x.s) + "</td></tr>");
        if (open[x.r.seq]) h.push('<tr><td></td><td colspan="3"><pre class="json">' + esc(JSON.stringify(x.r.data, null, 2)) + "</pre></td></tr>");
      });
      body.innerHTML = h.join("") || '<tr><td colspan="4" class="empty">No records match.</td></tr>';
      count.textContent = shown + " of " + rows.length + " records";
    }
    function toggle(tr) { var sq = +tr.dataset.seq; open[sq] = !open[sq]; paint(); }
    body.addEventListener("click", function (e) { var tr = e.target.closest("tr.row"); if (tr) toggle(tr); });
    body.addEventListener("keydown", function (e) { var tr = e.target.closest("tr.row"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tr); } });
    q.addEventListener("input", paint);
    document.querySelector(".seg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-f]"); if (!b) return;
      filter = b.dataset.f;
      Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      paint();
    });
    paint();
  }

  var resizeT;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (VIEWS[current]) drawTimeline(VIEWS[current]); }, 120);
  });
  window.addEventListener("hashchange", function () { current = pickFromHash(); drawTabs(); draw(); });
  current = pickFromHash();
  drawTabs();
  draw();
})();
</script>
</body>
</html>
